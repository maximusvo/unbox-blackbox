title: "Unboxing Black Boxes"
description: "Texte, Talks und Publikationen zur Frage, wie die Kreislaufgesellschaft gelingt. Mit Open Source Hardware und Open Design schaffen wir die Grundlage, um uns Technik anzueignen, zu reparieren und mitzugestalten - by Maximilian Voigt"
url: "https://unbox-blackbox.org"
baseurl: ""
lang: "de_DE"

email: unbox-contact@posteo.de
author:
  name: Maximilian Voigt
  twitter: ma__vo
repository: "unbox-blackbox"
logo: "/assets/img/mavo.jpg"

keywords:
  - Reparierbarkeit
  - Recht auf Reparatur
  - Kreislaufgesellschaft
  - Kreislaufwirtschaft
  - Open Source Hardware
  - Open Hardware
  - Technikaneignung
  - Zivilgesellschaft
  - Offene Werkstätten

twitter:
  username: ma__vo
  card: summary_large_image

# Gives every page a default social-share image so jekyll-seo-tag can emit
# og:image / twitter:image (and thus a summary_large_image card) — it only
# ever reads `page.image`, never site.logo. Built from the assembled
# cordless-drill hero illustration, see scripts/assets-gen/og-image.html.
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/og-image.png"

permalink: /blog/:title/

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-email-protect

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
