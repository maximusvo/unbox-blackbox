---
layout: default
---
{% include drill-hero.liquid %}


<section class="section" id="archiv">
  <div class="section-inner">
    <h2 class="section-headline">Texte &amp; Talks</h2>
    {% include filters.liquid %}
    <div class="teaser-grid" id="teaser-grid">
      {% assign sorted_posts = site.posts | sort: 'date' | reverse %}
      {% for post in sorted_posts %}
        {% include teaser.liquid post=post %}
      {% endfor %}
    </div>
  </div>
</section>
